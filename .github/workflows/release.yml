name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "plugin_version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3"
            exit 1
          fi

      - name: Run tests and build release plugin
        run: gradle --stacktrace -PpluginVersion=${{ steps.version.outputs.plugin_version }} test buildPlugin

      - name: Upload release test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analog-wakatime-release-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore

      - name: Locate release artifact
        id: artifact
        run: |
          zip_path="$(find build/distributions -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$zip_path" ]; then
            echo "Plugin ZIP artifact was not found."
            exit 1
          fi
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Generate checksum
        id: checksum
        run: |
          checksum_path="${{ steps.artifact.outputs.zip_path }}.sha256"
          sha256sum "${{ steps.artifact.outputs.zip_path }}" > "$checksum_path"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Analog WakaTime ${{ steps.version.outputs.plugin_version }}
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.zip_path }}
            ${{ steps.checksum.outputs.checksum_path }}
