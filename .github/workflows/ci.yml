name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
<<<<<<< HEAD
        run: ./gradlew --stacktrace test
=======
        run: gradle --stacktrace test
>>>>>>> 3355d92 (start)

      - name: Build plugin
        run: gradle --stacktrace buildPlugin

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analog-wakatime-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore

      - name: Locate plugin artifact
        id: artifact
        run: |
          zip_path="$(find build/distributions -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$zip_path" ]; then
            echo "Plugin ZIP artifact was not found."
            exit 1
          fi
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: analog-wakatime-plugin
          path: ${{ steps.artifact.outputs.zip_path }}
          if-no-files-found: error
